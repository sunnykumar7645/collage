spring.application.name=demo
server.port=8082

### Database Connection Configuration (PostgreSQL) ###

# 1. Driver Class Name
# Specifies the JDBC driver to use for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. JDBC URL
# The URL to connect to the database.
# - 'postgres' is the service name (container name/alias) in your docker-compose file.
#   Since both the Spring Boot app and 'postgres' are on the same 'pg_network',
#   Docker handles the service name resolution.
# - The port is the internal container port (5432).
# - 'mydatabase' is a placeholder. You should change this to the actual database name
#   you want to use inside the PostgreSQL container. If you don't explicitly create a DB
#   in your compose file, a default one named after the user ('root' in your case)
#   is created, but it's best practice to specify your own.
spring.datasource.url=jdbc:postgresql://localhost:5432/company?serverTimezone=Asia/Kolkata

# 3. Username
# Matches the POSTGRES_USER environment variable from your docker-compose.yml
spring.datasource.username=root

# 4. Password
# Matches the POSTGRES_PASSWORD environment variable from your docker-compose.yml
spring.datasource.password=root

### JPA/Hibernate Configuration ###

# 5. Dialect
# Specifies the Hibernate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 6. DDL Auto
# Controls how Hibernate interacts with the database schema:
# - `none`: Disable DDL statements. (Recommended for production)
# - `update`: Updates the schema when necessary. (Good for development/prototyping)
# - `create-drop`: Creates the schema on startup, drops it on shutdown. (Good for testing)
# - `create`: Creates the schema on startup.
spring.jpa.hibernate.ddl-auto=update

# Optional: Show SQL queries in the console for debugging
spring.jpa.show-sql=true